# NeuroTrap/CADN Cowrie override config.
# This is a minimal override. To start from the full upstream template, run:
#   docker run --rm cowrie/cowrie:latest cat /cowrie/cowrie-git/etc/cowrie.cfg.dist > honeypots/cowrie/etc/cowrie.cfg
# then merge the keys below.

[honeypot]
hostname = srv-db-prod-01
auth_class = UserDB
download_limit_size = 10485760

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.1
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
