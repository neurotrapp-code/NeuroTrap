# NeuroTrap/CADN management portal — hardened Nginx reverse proxy (Day 38).
# Terminates TLS, sets security headers, rate-limits, and proxies to gunicorn.
# Drop a real cert at /etc/nginx/certs/ (or use certbot) before going live.

# rate limit: 10 req/s per IP for the API, burst 20
limit_req_zone $binary_remote_addr zone=cadn_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=cadn_conn:10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;        # force HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cadn.crt;
    ssl_certificate_key /etc/nginx/certs/cadn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' ws: wss:" always;

    client_max_body_size 1m;
    limit_conn cadn_conn 20;

    # --- WebSocket live feed ---
    location /ws/ {
        proxy_pass http://portal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # --- API (rate-limited) ---
    location /api/ {
        limit_req zone=cadn_api burst=20 nodelay;
        proxy_pass http://portal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- dashboard + static ---
    location / {
        proxy_pass http://portal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
