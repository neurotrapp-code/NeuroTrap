# Week 5-6 management portal overlay (Day 38 hardening + Day 42 packaging).
# Run from the REPO ROOT together with the base stack:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.portal.yml up -d
#
# IMPORTANT: Compose resolves relative paths against the PROJECT DIRECTORY (the
# repo root, where docker-compose.yml lives) — NOT this file's location. So all
# paths below are written relative to the repo root (./deploy/..., ./data).
#
# The portal sits on management-net + elk-net (to read the event DB) but NEVER on
# honeypot-net, so a compromised honeypot cannot reach the console or database.
services:
  portal:
    build:
      context: .
      dockerfile: deploy/Dockerfile.portal
    container_name: cadn-portal
    restart: unless-stopped
    # No env_file (relative paths in overlays are fragile). Compose auto-loads
    # .env from the project dir for ${...} substitution below.
    environment:
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      SQLITE_PATH: /data/cadn.sqlite
      GEOIP_DB: /data/GeoLite2-City.mmdb
      # In-container Mongo host is the compose service `mongo`.
      MONGO_URI: mongodb://cadn:${MONGO_PASS:-CHANGE_ME}@mongo:27017/cadn?authSource=admin
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-120}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_FROM: ${ALERT_FROM:-}
      ALERT_TO: ${ALERT_TO:-}
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/data
    networks: [management-net, elk-net]
    # --- hardening ---
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    container_name: cadn-nginx
    restart: unless-stopped
    depends_on: [portal]
    # Admin console on 8443 — host ports 80/443 are left free for the Dionaea
    # HTTP honeypot. Ideally bind to the management IP: "<MGMT_IP>:8443:443",
    # or tunnel over SSH; expose on 0.0.0.0 only in an isolated lab.
    ports:
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks: [management-net]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
