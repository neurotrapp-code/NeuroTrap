services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cadn-cowrie
    restart: unless-stopped
    ports:
      - "22:2222"
      - "23:2223"
    volumes:
      - ./honeypots/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypots/cowrie/etc/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./honeypots/cowrie/honeyfs:/cowrie/cowrie-git/honeyfs
      - ./honeypots/cowrie/var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
    networks: [honeypot-net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

  dionaea:
    image: dinotools/dionaea:latest
    container_name: cadn-dionaea
    restart: unless-stopped
    ports:
      - "21:21"
      - "80:80"
      - "445:445"
      - "3307:3306"   # ✅ FIXED (كان 3306)
      - "5060:5060/udp"
    volumes:
      # Mount ONLY our JSON-logging handler — do NOT bind the whole etc dir, that
      # hides the image's real config and makes dionaea crash-loop (exit 133).
      - ./honeypots/dionaea/etc/ihandlers-enabled/log_json.yaml:/opt/dionaea/etc/dionaea/ihandlers-enabled/log_json.yaml:ro
      - ./honeypots/dionaea/var/log:/opt/dionaea/var/log/dionaea
      - ./honeypots/dionaea/var/log:/opt/dionaea/var/lib/dionaea/binaries
    networks: [honeypot-net]
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:7
    container_name: cadn-mongo
    restart: unless-stopped
    profiles: ["mongo"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: cadn
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-CHANGE_ME}
      MONGO_INITDB_DATABASE: cadn
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - elk-net
      - management-net

networks:
  honeypot-net:
    name: honeypot-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

  elk-net:
    name: elk-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

  management-net:
    name: management-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24

volumes:
  mongo-data: