name: CADN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r detection/requirements.txt
          pip install -r behavior/requirements.txt
          pip install -r deception/requirements.txt
          pip install -r api/requirements.txt
          pip install pydantic==2.7.1

      - name: Train intent model (gate: macro-F1 > 0.85)
        run: python behavior/train_model.py --n 80

      - name: Run test suite
        run: python -m pytest tests/ -v

  build-portal:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build portal image
        run: docker build -f deploy/Dockerfile.portal -t cadn-portal:ci .
